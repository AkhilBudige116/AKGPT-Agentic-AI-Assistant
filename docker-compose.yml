services:
  akgpt:
    build: .
    image: akgpt:latest
    container_name: akgpt
    ports:
      - "8080:8080"
    # .env is optional: without it AKGPT still starts (chat needs GROQ_API_KEY; tools and
    # LangSmith stay disabled until their keys are provided).
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/akgpt.db
      CHECKPOINT_DB_PATH: /app/data/langgraph_checkpoints.sqlite
      FAISS_INDEX_PATH: /app/faiss_db
      UPLOAD_DIR: /app/uploads
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    volumes:
      - akgpt_data:/app/data
      - akgpt_uploads:/app/uploads
      - akgpt_faiss:/app/faiss_db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  akgpt_data:
  akgpt_uploads:
  akgpt_faiss:
